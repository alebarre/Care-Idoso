spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careidoso}
    username: ${DB_USERNAME:careidoso}
    password: ${DB_PASSWORD:careidoso}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

logging:
  level:
    org.springframework.security: DEBUG
    com.careidoso: DEBUG
