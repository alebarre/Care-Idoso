version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: care-idoso-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-careidoso}
      POSTGRES_USER: ${DB_USERNAME:-careidoso}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careidoso}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-careidoso} -d ${DB_NAME:-careidoso}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
