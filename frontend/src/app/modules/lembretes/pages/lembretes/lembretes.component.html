<div class="page-screen">
  <header class="page-header">
    <a routerLink="/" class="icon-button" aria-label="Voltar">
      <fa-icon [icon]="['fas', 'arrow-left']"></fa-icon>
    </a>
    <h1 class="heading-md">Lembretes</h1>
    <div class="icon-placeholder"></div>
  </header>

  <section class="page-content">
    <div class="uber-card uber-card--flat">
      <div class="empty-state">
        <fa-icon [icon]="['fas', 'bell']" class="empty-state__icon"></fa-icon>
        <p class="body-md">Horários de remédios.</p>
        <p class="body-sm">Módulo em construção.</p>
      </div>
    </div>
  </section>
</div>
