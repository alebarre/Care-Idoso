<div class="login-screen">
  <div class="login-header">
    <div class="logo">Care Idoso</div>
    <p class="login-subtitle">Controle de rotinas de cuidadoras</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <div class="uber-field">
      <label for="email" class="uber-label">E-mail</label>
      <input
        id="email"
        type="email"
        class="uber-input"
        formControlName="email"
        placeholder="seu@email.com"
      />
    </div>

    <div class="uber-field">
      <label for="senha" class="uber-label">Senha</label>
      <input
        id="senha"
        type="password"
        class="uber-input"
        formControlName="senha"
        placeholder="Digite sua senha"
      />
    </div>

    <button
      type="submit"
      class="uber-button"
      [disabled]="loginForm.invalid || carregando"
    >
      <span *ngIf="!carregando">Entrar</span>
      <span *ngIf="carregando">Entrando...</span>
    </button>
  </form>

  <div class="login-links">
    <a routerLink="/login/esqueci-senha" class="login-link">Esqueci a senha</a>
    <span class="login-link-separator">•</span>
    <a routerLink="/login/nova-conta" class="login-link">Criar nova conta</a>
  </div>
</div>

<p-toast></p-toast>
