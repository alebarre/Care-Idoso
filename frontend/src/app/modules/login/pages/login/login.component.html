<div class="login-container">
  <p-card header="Care Idoso" subheader="Controle de rotinas">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          placeholder="seu@email.com"
          class="full-width"
        />
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <p-password
          id="senha"
          formControlName="senha"
          placeholder="Senha"
          [toggleMask]="true"
          [feedback]="false"
          class="full-width"
          styleClass="full-width"
          inputStyleClass="full-width"
        ></p-password>
      </div>

      <p-button
        type="submit"
        label="Entrar"
        class="full-width"
        styleClass="full-width"
        [loading]="carregando"
        [disabled]="loginForm.invalid"
      ></p-button>
    </form>
  </p-card>
</div>

<p-toast></p-toast>
