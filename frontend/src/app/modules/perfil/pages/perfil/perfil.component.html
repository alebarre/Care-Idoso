<div class="page-screen">
  <header class="page-header">
    <a routerLink="/" class="icon-button" aria-label="Voltar">
      <fa-icon [icon]="['fas', 'arrow-left']"></fa-icon>
    </a>
    <h1 class="heading-md">Meu Perfil</h1>
    <div class="icon-placeholder"></div>
  </header>

  <section class="page-content perfil">
    <div class="perfil__foto">
      <app-avatar [nome]="form.value.nome || usuario?.nome" [foto]="fotoAtual" [tamanho]="112"></app-avatar>

      <label class="uber-button uber-button--outline perfil__foto-botao" [class.perfil__foto-botao--desabilitado]="enviandoFoto">
        <fa-icon [icon]="['fas', 'camera']"></fa-icon>
        {{ enviandoFoto ? 'Enviando...' : 'Alterar foto' }}
        <input
          type="file"
          accept="image/jpeg,image/png"
          [disabled]="enviandoFoto"
          (change)="aoEscolherFoto($event)"
          hidden
        />
      </label>
      <p class="body-sm perfil__dica">JPG ou PNG, até 2 MB.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="salvar()" class="perfil__form" novalidate>
      <div class="uber-field">
        <label class="uber-label" for="nome">Nome</label>
        <input id="nome" class="uber-input" type="text" formControlName="nome" autocomplete="name" />
        <small class="perfil__erro" *ngIf="mostrarErro('nome')">Informe um nome com 3 a 120 caracteres.</small>
      </div>

      <div class="uber-field">
        <label class="uber-label" for="email">E-mail</label>
        <input id="email" class="uber-input" type="email" formControlName="email" autocomplete="email" />
        <small class="perfil__erro" *ngIf="mostrarErro('email')">Informe um e-mail válido.</small>
      </div>

      <h2 class="heading-md perfil__secao">Alterar senha</h2>
      <p class="body-sm perfil__dica">Deixe em branco para manter a senha atual.</p>

      <div class="uber-field">
        <label class="uber-label" for="senhaAtual">Senha atual</label>
        <input id="senhaAtual" class="uber-input" type="password" formControlName="senhaAtual" autocomplete="current-password" />
        <small class="perfil__erro" *ngIf="form.hasError('senhaAtualObrigatoria') && form.get('novaSenha')?.dirty">
          Informe a senha atual para definir uma nova.
        </small>
      </div>

      <div class="uber-field">
        <label class="uber-label" for="novaSenha">Nova senha</label>
        <input id="novaSenha" class="uber-input" type="password" formControlName="novaSenha" autocomplete="new-password" />
        <small class="perfil__erro" *ngIf="mostrarErro('novaSenha')">A nova senha deve ter de 6 a 100 caracteres.</small>
      </div>

      <button type="submit" class="uber-button" [disabled]="salvando">
        {{ salvando ? 'Salvando...' : 'Salvar' }}
      </button>
    </form>
  </section>
</div>

<p-toast></p-toast>
