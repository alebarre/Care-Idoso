<div class="app-shell">
  <aside class="app-sidebar" *ngIf="!isLoginPage">
    <div class="app-sidebar__brand">
      <span class="app-sidebar__logo">Care Idoso</span>
    </div>

    <nav class="app-sidebar__nav">
      <a
        *ngFor="let item of itensNavegacao"
        class="app-sidebar__link"
        [routerLink]="item.path"
        routerLinkActive="app-sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: !!item.exato }"
      >
        <fa-icon [icon]="['fas', item.icone]"></fa-icon>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="app-sidebar__footer" *ngIf="usuarioLogado$ | async as usuario">
      <a class="app-sidebar__user" routerLink="/perfil" aria-label="Abrir meu perfil">
        <app-avatar [nome]="usuario.nome" [foto]="usuario.foto" [tamanho]="36"></app-avatar>
        <span class="app-sidebar__user-info">
          <span class="app-sidebar__user-name">{{ usuario.nome }}</span>
          <span class="app-sidebar__user-role">{{ usuario.perfil }}</span>
        </span>
      </a>
      <button class="icon-button" (click)="logout()" aria-label="Sair">
        <fa-icon [icon]="['fas', 'sign-out-alt']"></fa-icon>
      </button>
    </div>
  </aside>

  <main class="app-shell__content" [class.app-shell__content--com-sidebar]="!isLoginPage">
    <router-outlet></router-outlet>
  </main>
</div>
